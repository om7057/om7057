<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 560 380" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <rect width="560" height="380" rx="8" fill="#0a0a0b"/>
  <text x="26" y="42" fill="#60a5fa" font-size="26" font-weight="700">Languages by Contribution</text>
  <text x="26" y="66" fill="#71717a" font-size="15">Across 76 merged OSS pull requests</text>

  <!-- legend -->
  <g font-size="20" font-weight="600">
    <circle cx="36" cy="116" r="8" fill="#00ADD8"/>
    <text x="56" y="123" fill="#e4e4e7">Go 56.6%</text>

    <circle cx="36" cy="158" r="8" fill="#ED8B00"/>
    <text x="56" y="165" fill="#e4e4e7">Java 22.4%</text>

    <circle cx="36" cy="200" r="8" fill="#00599C"/>
    <text x="56" y="207" fill="#e4e4e7">C++ 14.5%</text>

    <circle cx="36" cy="242" r="8" fill="#6b7280"/>
    <text x="56" y="249" fill="#e4e4e7">Other 5.3%</text>

    <circle cx="36" cy="284" r="8" fill="#3178C6"/>
    <text x="56" y="291" fill="#e4e4e7">TypeScript 1.3%</text>
  </g>

  <!-- donut -->
  <g transform="translate(320, 75)">
    <circle cx="100" cy="100" r="78" fill="none" stroke="#26262a" stroke-width="38"/>
    <g transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="78" fill="none" stroke="#00ADD8" stroke-width="38"
        stroke-dasharray="277.287 212.802" stroke-dashoffset="0"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#ED8B00" stroke-width="38"
        stroke-dasharray="109.625 380.463" stroke-dashoffset="-277.287"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#00599C" stroke-width="38"
        stroke-dasharray="70.934 419.155" stroke-dashoffset="-386.912"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#6b7280" stroke-width="38"
        stroke-dasharray="25.794 464.294" stroke-dashoffset="-457.846"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#3178C6" stroke-width="38"
        stroke-dasharray="6.449 483.640" stroke-dashoffset="-483.640"/>
    </g>
  </g>
