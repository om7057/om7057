<svg xmlns="http://www.w3.org/2000/svg" width="880" height="600" viewBox="0 0 440 300" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <rect width="440" height="300" rx="8" fill="#0a0a0b"/>
