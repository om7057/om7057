<svg xmlns="http://www.w3.org/2000/svg" width="500" height="240" viewBox="0 0 500 240" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <rect width="500" height="240" rx="8" fill="#0a0a0b"/>
  <text x="30" y="34" fill="#60a5fa" font-size="17" font-weight="700">Languages by Contribution</text>
  <text x="30" y="54" fill="#71717a" font-size="11">Across 76 merged OSS pull requests</text>

  <!-- legend -->
  <g font-size="13">
    <circle cx="38" cy="86" r="5" fill="#00ADD8"/>
    <text x="52" y="91" fill="#e4e4e7">Go 56.6%</text>

    <circle cx="38" cy="114" r="5" fill="#ED8B00"/>
    <text x="52" y="119" fill="#e4e4e7">Java 22.4%</text>

    <circle cx="38" cy="142" r="5" fill="#00599C"/>
    <text x="52" y="147" fill="#e4e4e7">C++ 14.5%</text>

    <circle cx="38" cy="170" r="5" fill="#6b7280"/>
    <text x="52" y="175" fill="#e4e4e7">Other 5.3%</text>

    <circle cx="38" cy="198" r="5" fill="#3178C6"/>
    <text x="52" y="203" fill="#e4e4e7">TypeScript 1.3%</text>
  </g>

  <!-- donut -->
  <g transform="translate(290, 20)">
    <circle cx="100" cy="100" r="70" fill="none" stroke="#26262a" stroke-width="34"/>
    <g transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="70" fill="none" stroke="#00ADD8" stroke-width="34"
        stroke-dasharray="248.847 190.976" stroke-dashoffset="0"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#ED8B00" stroke-width="34"
        stroke-dasharray="98.381 341.442" stroke-dashoffset="-248.847"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#00599C" stroke-width="34"
        stroke-dasharray="63.659 376.164" stroke-dashoffset="-347.229"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#6b7280" stroke-width="34"
        stroke-dasharray="23.149 416.674" stroke-dashoffset="-410.887"/>
      <circle cx="100" cy="100" r="70" fill="none" stroke="#3178C6" stroke-width="34"
        stroke-dasharray="5.787 434.036" stroke-dashoffset="-434.036"/>
    </g>
  </g>
</svg>
