<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="760" viewBox="0 0 520 380" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <rect width="520" height="380" rx="8" fill="#0a0a0b"/>
  <text x="26" y="38" fill="#60a5fa" font-size="18" font-weight="700">Languages by Contribution</text>
  <text x="26" y="60" fill="#71717a" font-size="12">Across 76 merged OSS pull requests</text>

  <!-- legend -->
  <g font-size="14">
    <circle cx="34" cy="108" r="6" fill="#00ADD8"/>
    <text x="50" y="113" fill="#e4e4e7">Go 56.6%</text>

    <circle cx="34" cy="142" r="6" fill="#ED8B00"/>
    <text x="50" y="147" fill="#e4e4e7">Java 22.4%</text>

    <circle cx="34" cy="176" r="6" fill="#00599C"/>
    <text x="50" y="181" fill="#e4e4e7">C++ 14.5%</text>

    <circle cx="34" cy="210" r="6" fill="#6b7280"/>
    <text x="50" y="215" fill="#e4e4e7">Other 5.3%</text>

    <circle cx="34" cy="244" r="6" fill="#3178C6"/>
    <text x="50" y="249" fill="#e4e4e7">TypeScript 1.3%</text>
  </g>

  <!-- donut -->
  <g transform="translate(300, 75)">
    <circle cx="100" cy="100" r="78" fill="none" stroke="#26262a" stroke-width="38"/>
    <g transform="rotate(-90 100 100)">
      <circle cx="100" cy="100" r="78" fill="none" stroke="#00ADD8" stroke-width="38"
        stroke-dasharray="277.287 212.802" stroke-dashoffset="0"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#ED8B00" stroke-width="38"
        stroke-dasharray="109.625 380.463" stroke-dashoffset="-277.287"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#00599C" stroke-width="38"
        stroke-dasharray="70.934 419.155" stroke-dashoffset="-386.912"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#6b7280" stroke-width="38"
        stroke-dasharray="25.794 464.294" stroke-dashoffset="-457.846"/>
      <circle cx="100" cy="100" r="78" fill="none" stroke="#3178C6" stroke-width="38"
        stroke-dasharray="6.449 483.640" stroke-dashoffset="-483.640"/>
    </g>
  </g>
</svg>
